# 发布流程（详见 README「发布新版本」）：
#   1. gradle.properties 里改 mod_version；CHANGELOG.md 顶部加同版本号的一节
#   2. 推送标签 v<mod_version>（例如 v1.5.1-zh.2；测试版用 v1.5.1-zh.3-beta.1）
#   3. 这里自动：检查版本号 → 建草稿发布（说明取自 CHANGELOG）→ 编译 26.2/26.3 并上传 jar → 正式发布
# 平时每次推送也会编译两个版本，jar 在 Actions 页面的 Artifacts 里。

name: build
on:
  push:
    branches: [skyblock-zh]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  prepare:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - name: check version and write release notes
        run: |
          VERSION="${TAG#v}"
          MOD_VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          if [ "$VERSION" != "$MOD_VERSION" ]; then
            echo "::error::标签 $TAG 和 gradle.properties 里的 mod_version=$MOD_VERSION 不一致"; exit 1
          fi
          sed "s/{VERSION}/$VERSION/g" .github/release-header.md > notes.md
          awk -v v="$VERSION" '
            index($0, "## " v " ") == 1 || $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > section.md
          if [ ! -s section.md ]; then
            # 测试版（1.5.1-zh.3-beta.1）可以直接用正式版号（1.5.1-zh.3）那一节
            BASE="$(echo "$VERSION" | sed -E 's/-(beta|pre|rc).*$//')"
            awk -v v="$BASE" '
              index($0, "## " v " ") == 1 || $0 == "## " v { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > section.md
          fi
          if [ ! -s section.md ]; then
            echo "::error::CHANGELOG.md 里没有找到「## $VERSION」这一节"; exit 1
          fi
          case "$VERSION" in *-beta*|*-pre*|*-rc*)
            printf '> **测试版**：新功能还在验证，遇到问题请回退到上一个正式版。\n\n' >> notes.md;;
          esac
          cat section.md >> notes.md
      - name: create draft release
        run: |
          PRE=""
          case "$TAG" in *-beta*|*-pre*|*-rc*) PRE="--prerelease";; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md --title "SkyBlock 中文翻译 ${TAG#v}" $PRE
          else
            gh release create "$TAG" --draft --verify-tag --title "SkyBlock 中文翻译 ${TAG#v}" --notes-file notes.md $PRE
          fi

  build:
    needs: prepare
    if: ${{ !failure() && !cancelled() }}
    name: build mc${{ matrix.mc }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.2', '26.3']
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build -PmcTarget=${{ matrix.mc }} --no-daemon --stacktrace
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: npc_translator_skyblock_zh-mc${{ matrix.mc }}
          path: build/libs/*+mc${{ matrix.mc }}.jar
      - name: upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" build/libs/*+mc${{ matrix.mc }}.jar --clobber

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: publish release
        run: |
          case "$TAG" in
            *-beta*|*-pre*|*-rc*) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease ;;
            *) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest ;;
          esac
