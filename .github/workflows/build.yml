# 构建与发布工作流，说明见 docs/RELEASING.md。
#   - 推送到 skyblock-zh 分支或提交 Pull Request：构建 Minecraft 26.2 与 26.3 两个版本。
#   - 推送 v* 标签：校验版本号，按 CHANGELOG.md 生成发布说明，构建并上传 jar，最后发布。

name: build
on:
  push:
    branches: [skyblock-zh]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  prepare:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - name: check version and write release notes
        run: |
          VERSION="${TAG#v}"
          MOD_VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          if [ "$VERSION" != "$MOD_VERSION" ]; then
            echo "::error::标签 $TAG 与 gradle.properties 中的 mod_version（$MOD_VERSION）不一致"; exit 1
          fi
          sed "s/{VERSION}/$VERSION/g" .github/release-header.md > notes.md
          section() {
            awk -v v="$1" '
              index($0, "## [" v "]") == 1 || index($0, "## " v " ") == 1 || $0 == "## " v { found = 1; next }
              found && /^## / { exit }
              found && /^\[[^]]+\]: / { next }
              found { print }
            ' CHANGELOG.md
          }
          section "$VERSION" > section.md
          BASE="$(echo "$VERSION" | sed -E 's/-(beta|pre|rc).*$//')"
          # 预发布版本使用对应正式版的条目
          [ -s section.md ] || section "$BASE" > section.md
          if [ ! -s section.md ]; then
            echo "::error::CHANGELOG.md 中缺少版本 $VERSION 的条目"; exit 1
          fi
          case "$VERSION" in *-beta*|*-pre*|*-rc*)
            printf '> [!NOTE]\n> 此为 %s 的预发布版本，用于测试，可能存在问题。日常使用请选择最新正式版。\n\n' "$BASE" >> notes.md;;
          esac
          echo "## 更新内容" >> notes.md
          cat section.md >> notes.md
      - name: create draft release
        run: |
          PRE=""
          case "$TAG" in *-beta*|*-pre*|*-rc*) PRE="--prerelease";; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md --title "SkyBlock 中文翻译 ${TAG#v}" $PRE
          else
            gh release create "$TAG" --draft --verify-tag --title "SkyBlock 中文翻译 ${TAG#v}" --notes-file notes.md $PRE
          fi

  build:
    needs: prepare
    if: ${{ !failure() && !cancelled() }}
    name: build mc${{ matrix.mc }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.2', '26.3']
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build -PmcTarget=${{ matrix.mc }} --no-daemon --stacktrace
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: npc_translator_skyblock_zh-mc${{ matrix.mc }}
          path: build/libs/*+mc${{ matrix.mc }}.jar
      - name: upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" build/libs/*+mc${{ matrix.mc }}.jar --clobber

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: publish release
        run: |
          case "$TAG" in
            *-beta*|*-pre*|*-rc*) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease ;;
            *) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest ;;
          esac
