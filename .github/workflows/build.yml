# 每次推送都编译 26.2 和 26.3 两个版本（检查能不能编过，jar 在 Actions 页面的 Artifacts 里）。
# 推送 v 开头的标签（例如 v1.5.2-zh.1）时，两个 jar 会自动上传到同名的 Release；
# 也可以在 Actions 页面手动运行，填一个已有的标签，给那个版本补传 jar。

name: build
on:
  push:
    branches: [skyblock-zh]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: '要编译并上传 jar 的版本标签（例如 v1.5.1-zh.1）'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build mc${{ matrix.mc }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.2', '26.3']
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build -PmcTarget=${{ matrix.mc }} --no-daemon --stacktrace
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: npc_translator_skyblock_zh-mc${{ matrix.mc }}
          path: build/libs/*+mc${{ matrix.mc }}.jar
      - name: upload to release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "SkyBlock 中文翻译 ${TAG#v}" \
              --notes "26.2 用 +mc26.2 的 jar，26.3 用 +mc26.3 的 jar。前置：Fabric API、YetAnotherConfigLib、ModMenu。" || true
          fi
          gh release upload "$TAG" build/libs/*+mc${{ matrix.mc }}.jar --clobber
