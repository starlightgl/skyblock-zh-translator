buildscript {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:${loom_version}"
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'maven-publish'

// Per-Minecraft-version settings live in gradle-<mcTarget>.properties
def mcTarget = project.findProperty('mcTarget') ?: '26.3'
def targetProps = new Properties()
file("gradle-${mcTarget}.properties").withInputStream { targetProps.load(it) }

version = "${project.mod_version}+mc${mcTarget}"
group = project.maven_group

base {
    archivesName = "npc_translator_skyblock_zh"
}

repositories {
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases/" }
	maven { url "https://maven.isxander.dev/releases" }
}

loom {
}

sourceSets {
    main {
        java { srcDirs = ['src/main26/java'] }
        resources { srcDirs = ['src/main26/resources'] }
    }
}

dependencies {
	minecraft "com.mojang:minecraft:${targetProps['minecraft_version']}"
	// 26.x is unobfuscated - use implementation instead of modImplementation
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${targetProps['fabric_api_version']}"
	
	compileOnly "dev.isxander:yet-another-config-lib:3.8.1+1.21.4-neoforge"
	implementation "com.terraformersmc:modmenu:${targetProps['modmenu_version']}"
}

processResources {
	def version = project.version
	def minecraftDep = targetProps['minecraft_dep']
	inputs.property "version", version
	inputs.property "minecraftDep", minecraftDep

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_dep": minecraftDep
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
	from("NOTICE.md") {
		rename { "NOTICE_${projectName}.md" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
